name: Dependency audit
on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "pytest>=8,<10" "ruff>=0.11,<1" "mypy>=1.15,<2" "build>=1.2,<2" "pip-audit>=2.9,<3" "setuptools>=77,<85"
      - run: python -m pip_audit --strict --cache-dir .audit-cache
